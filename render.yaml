services:
  - type: web
    name: wc2026
    env: node
    plan: starter
    buildCommand: npm install && npm --prefix client install --include=dev && npm --prefix server install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      # Public site URL — used for CORS and for invite/referral/QR links.
      # Same origin in this monolith deploy; update both when a custom domain is ready.
      - key: CLIENT_ORIGIN
        value: https://wc2026-j5e5.onrender.com
      - key: APP_BASE_URL
        value: https://wc2026-j5e5.onrender.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
